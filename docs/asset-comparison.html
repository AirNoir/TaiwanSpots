./assets/spots/palace-museum/collection/thumbnail.png","sources":{"id":"palace-museum","title":"『2024-2025 年末年始台湾 ８日間⑧　～５日目午前：台北観光　故宮博物院訪問と絶品魯肉飯と豚足を食す～』台北(台湾)の旅行記・ブログ by たびっこさんciteフォートラベル","page":"https://4travel.jp/travelogue/11975300","image":"https://cdn.4travel.jp/img/thumbnails/imk/travelogue_album/11/97/53/650x_11975300.jpg?updated_at=1750839921","description":" National Palace Museum Entrance\n\nA family trip to Taipei’s National Palace Museum begins with a quiet morning arrival at the grand marble staircases leading up to the main hall. Taiwanese flags line the white balustrades, and the museum’s green-tiled roofs and pale yellow walls stand out against a backdrop of wooded hills under a cloudy sky. Only a handful of visitors are present before opening, allowing for unobstructed photos of the iconic facade.\n\nInside, the group uses their Taipei FunPASS to bypass the regular ticket line and store their luggage in self-service lockers. They explore renowned exhibits such as the Jadeite Cabbage and Mao Gong Ding, noting that some treasures like the Meat-Shaped Stone are on loan elsewhere. After a thorough tour of the first-floor galleries, they plan to continue their cultural and culinary adventure in Taipei, sampling local specialties and visiting other landmarks throughout the day.","supplementary":[{"file":"real-photo-overview.jpg","title":"NationalPalace MuseumFrontView.jpg","page":"https://commons.wikimedia.org/wiki/File:NationalPalace_MuseumFrontView.jpg","image":"https://upload.wikimedia.org/wikipedia/commons/b/b4/NationalPalace_MuseumFrontView.jpg","author":"Peellden","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0/","date":"2007-12-16","description":"Historical elevated overview used for main-hall roof massing and terraces; not evidence of current landscaping."},{"file":"google-air-overview.jpg","title":"故宮館方空中 360° 全景（Google Maps）","page":"https://www.google.com/maps/place/National+Palace+Museum/@25.101867,121.54874 s gently bobbing on the water beside a stone-paved path. Trees line the promenade, providing shade for visitors who wander past small shops and food stalls. A red circular sign bearing the character “停” stands near a bench where a visitor sits, adding a touch of local signage to the scene.\n\nTamsui Old Street, once called Huwei, stretches along Zhongzheng Road beside the MRT Tamsui Station plaza and follows the Tamsui River’s edge. Known for its historic architecture and famous local snacks—iron eggs, shrimp rolls, A-gei, fish crisps, and grilled squid—the area welcomes tourists year-round. The calm water, overcast sky, and leisurely pace of pedestrians capture the laid-back charm of this northern Taiwan landmark."},"blueprint":{"spotId":"tamsui","status":"references-collected","spotType":"urban","productionTier":"standard","hero":{"name":"Tamsui riverfront with Guanyin Mountain","silhouette":"Broad river mouth with a waterfront promenade and ferry pier on the near bank, and the gently peaked profile of Guanyin Mountain on the far bank"},"crop":"The Tamsui Old Street riverfront stretch: promenade, ferry pier, the edge of the old street buildings, the river and Guanyin Mountain across it. Not Fisherman's Wharf, not Fort San Domingo, not the whole town.","heroScale":1,"orientation":"River flows north-west to the sea; the old street sits on the north-east bank, Guanyin Mountain across the river to the south-west; sunset over the river mouth","lockedGeometry":["river width and flow direction toward the sea","promenade running along the bank","ferry pier position on the promenade (verify)","old street buildings behind the promenade","Guanyin Mountain on the opposite bank"],"lockedIdentity":["Guanyin Mountain profile across the water","low riverside shophouse frontage","ferries on the river","warm sunset light"],"doNotInvent":["Taiwan flags","random buildings","Lover's Bridge (it is at Fisherman's Wharf, outside the crop)","large bridges spanning the river","sandy beache assets/spots/dadaocheng/reference/google-ground-street.jpg"},{"file":"google-satellite-street.jpg","url":"../assets/spots/dadaocheng/reference/google-satellite-street.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/dadaocheng/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/dadaocheng/collection/thumbnail.png","sources":{"id":"dadaocheng","title":"大稻埕實景導覽照片","page":"https://www.mtttour.com.tw/dadaocheng/","image":"https://www.mtttour.com.tw/material-alias/%E5%B0%8E%E8%A6%BD/%E5%A4%A7%E7%A8%BB%E5%9F%95%E8%8A%B1%E7%B5%AE/IMG_9068.JPG","description":" Red Brick Arcade and Parked Scooters\n\nA two‑story red brick arcade building stands along Dihua Street in Taipei’s Datong District, showcasing a row of elegant arches on the ground floor and large, multi‑pane windows above. The façade features decorative stone panels and traditional Chinese characters reading “豐濱,” hinting at the building’s historical or commercial significance. \n\nIn front of the arcade, a neat line of motor scooters occupies the street parking spaces, reflecting the daily rhythm of urban commuters. The contrast between the vintage brick architecture and the modern scooters captures the blend of heritage and contemporary life in Taipei. The bright daylight illuminates the scene, emphasizing the textures of the brickwork and the vibrant colors of the parked vehicles.","supplementary":[{"local":"google-ground-street.jpg","page":"https://www.google.com/maps/@25.068666,121.510865,3a,90y,275.3h,90t/data=!3m4!1e1!3m2!1sCIHM0ogKEICAgIDEr5XOygE!2e10","credit":"Super 720 via Google Maps","capture":"2015-04 footer; uploaded 2016-08","accessed":"2026-10-14","kind":"ground panorama","observations":["Visible Xiahai temple courtyard and continuous adjoining street shops","Arcade, shop awnings, low street facades; narrow street"],"limitations":"Uploader geotag appears inconsistent with visible Xiahai scene; do not use coordinates to establish actual location"},{"local":"google-satellite-street.jpg","pag e the gable ornaments slightly."},"qa":{"geographic":"pending","identity":"pending","style":"pending","collection":"pending","notes":"New generation from real ornate facade photograph + Google ground panorama + satellite street grid; carved brick/stucco facade and narrow street recognizable. Repeated facade ornament, opposite facade arrangement and rear roofs are simplifications; exact facade-to-map match pending; panorama geotag inconsistent. Preview review-v1.png only; no automatic master approval."}},"photo":"real-photo.jpg"},{"id":"yehliu","name":"野柳地質公園","models":[{"file":"master.png","url":"../assets/spots/yehliu/collection/master.png"},{"file":"review-v1.png","url":"../assets/spots/yehliu/collection/review-v1.png"},{"file":"review-v2.png","url":"../assets/spots/yehliu/collection/review-v2.png"},{"file":"review-v3.png","url":"../assets/spots/yehliu/collection/review-v3.png"},{"file":"review-v4.png","url":"../assets/spots/yehliu/collection/review-v4.png"}],"model":"review-v4.png","photos":[{"file":"google-ground-queen.jpg","url":"../assets/spots/yehliu/reference/google-ground-queen.jpg"},{"file":"google-satellite-queen.jpg","url":"../assets/spots/yehliu/reference/google-satellite-queen.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/yehliu/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/yehliu/collection/thumbnail.png","sources":{"id":"yehliu","title":"Fate of 'Queen's Head' uncertain despite efforts to save it - Focus Taiwan","page":"https://focustaiwan.tw/society/201505250028","image":"https://imgcdn.cna.com.tw/Eng/WebEngPhotos/1024/2015/20150525/201505250028t0001.jpg","description":" Queen’s Head at Yehliu Geopark\n\nThe Queen’s Head, a honey‑colored sandstone formation, stands on a flat coastal shelf in northern Taiwan. Its narrow neck supports a larger, weather‑eroded head, marked by pockmarks and wind‑sculpted textures. Warm afternoon light accentuates the rock’s golden hues and the smooth, undulating surface of the surrounding platform.\n\ ./assets/spots/gaomei/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/gaomei/collection/thumbnail.png","sources":{"id":"gaomei","title":"Gaomei Wetland－Taichung Tourism","page":"https://travel.taichung.gov.tw/en/attractions/intro/886","image":"https://travel.taichung.gov.tw/content/images/attractions/16388/1024x768_Filedata635853571982134053.jpg","description":" Sunset Stroll on Gaomei Wetland Boardwalk\n\nA gently curving wooden boardwalk winds across the expansive mudflats of Gaomei Wetland, bathed in the warm glow of a setting sun. Visitors pause along the path, taking in the serene vista where shallow pools mirror the sky’s golden hues and distant wind turbines stand sentinel along the horizon.\n\nGaomei Wetland spans 1,500 acres south of the Dajia River mouth, featuring a mix of sand and soil that supports Taiwan’s largest stand of Bolboschoenus planiculmis. Each fall and winter, migrating birds flock here, drawn by the diverse habitats. The reserve offers amenities such as a service center, parking, restrooms, viewing platforms, trails, and a bus stop, making it an accessible and popular spot for nature enthusiasts and bird-watchers alike.","supplementary":[{"local":"google-ground-boardwalk.jpg","page":"https://www.google.com/maps/@?api=1&map_action=pano&pano=LrtzFr8kU1d-8DYwUcw_HQ&heading=266.23","credit":"Google Street View","capture":"2017-08","accessed":"2026-10-14","kind":"ground panorama","observations":["Wood-plank boardwalk curves toward tidal flat","Low horizontal edge railing rather than tall metal fence","Distant wind turbines line the coast left of sunset"],"limitations":"Historical railing/crowd condition; current fine structures pending"},{"local":"google-satellite-boardwalk.jpg","page":"https://www.google.com/maps/@24.3125568,120.5473767,17z/data=!3m1!1e3","credit":"Google Maps / Airbus/CNES/Maxar","accessed":"2026-10-14","capture":"Not exposed","kind":"satellite overhead","observations":["Boardwalk from eastern seawall meanders westwar raws photographers and art lovers alike.\n\nThis stop was part of a larger seven-city Taiwan tour, which included Taipei’s iconic 101 observatory, the lantern-lit sky of Shifen, and the nostalgic alleys of Jiufen. Travelers rated the overall experience highly for sightseeing and transportation, noting the ease of bus and high-speed rail connections. The Rainbow Village stands out as a testament to individual creativity, turning a once-forgotten military settlement into one of central Taiwan’s most Instagrammed landmarks.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Rainbow+Village/@24.1336514,120.6098856,3a,75y,359.89h,90.11t/data=!3m8!1e1!3m6!1sCIABIhCYlKxEzwcreH5jWOnWlmuH!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U_eMZu5FVXUgUPSMN43nKvzxr1ukzr_hyhzncSFgty02UnAh7QHEVJvT_RfLLimQys6kICFmaNrYyjBZRrQHcMtNaSrfhfaDnccHMZPHTiu0KsIBfDYLlP68WrfkI-bXlNQwOMsWbLcLXKC%3Dw900-h600-k-no-pi-0.11253999999999564-ya359.88745-ro0-fo100!7i5888!8i2944!4m9!3m8!1s0x34693e87f82595db:0x9a8836cb8c007336!8m2!3d24.1337152!4d120.6098437!10e5!14m1!1BCgIgARICCAI!16s%2Fg%2F11cls6p_by?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Sanctum Realm via Google Maps","capture":"2025-07","observations":["Low painted courtyard/lane","Weathered white/red naive figures, painted red ground, shallow canopy"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@24.1337152,120.6098437,98m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Small surviving cluster around narrow lane; not a complete village","Open surroundings and nearby apartment blocks outside crop"],"usage":"Research reference only; Google attribution/UI retained, ssets/spots/lukang/collection/master.png"},{"file":"review-v1.png","url":"../assets/spots/lukang/collection/review-v1.png"}],"model":"review-v1.png","photos":[{"file":"context-photo.jpg","url":"../assets/spots/lukang/reference/context-photo.jpg"},{"file":"google-aerial-review.jpg","url":"../assets/spots/lukang/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/lukang/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/lukang/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/lukang/collection/thumbnail.png","sources":{"id":"lukang","title":"摸乳巷-遊憩景點-彰化旅遊資訊網","page":"https://tourism.chcg.gov.tw/AttractionsContent.aspx?chk=410219db-b79a-4464-9e75-75d910ae8ce4&id=147&l=TW","image":"https://tourism.chcg.gov.tw/upload/27/2023101615081775428.png","description":" Mōrǔ Xiàng (Breast-Touching Lane)\n\nNestled in Lukang, Changhua County, this historic alley measures under 70 centimeters at its narrowest point, forcing passersby to brush shoulders as they traverse the red-brick corridor. A faded red doorframe at the entrance displays vertical couplets reading “摸乳巷裡無乳摸,” hinting at the alley’s cheeky moniker. Overhead, verdant foliage softens the brick walls, while a lone visitor stands at the far end, illustrating the alley’s intimate scale.\n\nOriginally designed as a firebreak between long row houses and to shield interiors from strong sea winds, the passage earned various names—“Chest-Guarding Lane” and “Gentlemen’s Lane”—before the blunt “Breast-Touching Lane” became most renowned. A folk tale suggests the name also echoes “Dream Lane,” reflecting ancient hopes for childbirth, which over time merged phonetically into the current title.","supplementary":[{"title":"跟著課本走鹿港│鹿港老街、古蹟、老屋維修與傳統工藝，符合國小社會課本的我的家鄉主題導覽","page":"https://changhua-travel.com/event/detail/31","image":"https://cdn.thothcdn.com/cache/changhua-travel/images/upload_file/dsc_5614_compressed-xeletv.jpg","description":" Lukang Old Street Alley\n\nA quiet, narrow alley in Lukang Old Street showcases red-brick facades and a row of parked scooters along a tiled pathway. Overhead electrical wires crisscross above, while a small wooden lantern affixed to the wall evokes the district’s historic charm. Potted greenery and glimpses of traditional doorways further enrich the scene.\n\nThis setting is part of a guided tour in Changhua County that highlights the preservation of century-old buildings, local crafts, and cultural heritage. Visitors explore sites like Tianhou Temple, half-wells, and restored residences, learning how sustainable practices and adaptive reuse keep Lukang’s stories alive.","file":"context-photo.jpg"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@24.056301,120.4325817,196m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Putou Street curves through narrow deep lots","Yaolin Street continues south; no temple in compact street crop"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/@24.056488,120.4325276,7a,75y,307.75h,90t/data=!3m7!1e1!3m5!1sqfnP1bVEgQyU5uaYU8ia5A!2e0!6shttps:%2F%2Fstreetviewpixels-pa.clients6.google.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D0%26panoid%3DqfnP1bVEgQyU5uaYU8ia5A%26yaw%3D307.750880132954!7i13312!8i6656?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Street View","capture":"2019-03","observations":["16 Butou Street: narrow curved red-brick paving","Continuous brick/stucco shophouses, deep lots, doors/awnings/lanterns"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"}]},"blueprint":{"spotId":"lukang","status":"references-collec nd-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/alishan/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/alishan/collection/thumbnail.png","sources":{"id":"alishan","title":"阿里山國家森林遊樂區 > 觀光景點 > 交通部觀光署","page":"https://www.taiwan.net.tw/m1.aspx?id=10949&sNo=0001016","image":"https://www.taiwan.net.tw/att/1/big_scenic_spots/pic_10949_24.jpg","description":" Alishan Forest Railway Train\n\nA bright red narrow-gauge train winds its way through the dense cedar forests of Taiwan’s Alishan National Forest Recreation Area. The vintage carriages, painted in red and white, stand out against the lush greenery and towering trees. Alongside the tracks, a moss-covered stone wall and wooden railing guide the path, enhancing the historic atmosphere.\n\nAlishan is famed for its forest railway, built during the Japanese colonial era to transport timber. Today, it offers visitors a tranquil ride through ancient woods, misty valleys, and scenic mountain landscapes. The legend of Chief Abali, who first hunted in these forests over 250 years ago, lends cultural depth to this natural wonder.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Sacred+Tree+Station/@23.519144,120.806633,3a,75y,280h,90t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgID4xK6yQg!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U_rkB-kDH0YpO_-ZqmdNKoDVUMIKiaxFTHfq2NZ2OtTMUjDWwIYckZV4BjYpwgh2jCLOfEWm0ZsY5-eIY_l9-p2puIOLc74_Zl0J6Cdem7UhLFP0wLyxo5QFDYkL6q8S6ePsFam%3Dw900-h600-k-no-pi0-ya160-ro0-fo100!7i9728!8i4864!4m9!3m8!1s0x346edea230e424b9:0xcb9ae78ab4298e3d!8m2!3d23.519174!4d120.80668!10e5!14m1!1BCgIgARICCAI!16s%2Fg%2F155q0z5s?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"CJ via Google Maps","capture":"2015-06 footer; uploaded 2015-07","observations":["Dense tall conifer trunks, ferns, steep forest slope","Wooden walking steps beside station; no tea fields"],"limitations":"Train geom htower capped with a red-tiled roof peeks out from behind a canopy of lush green trees, offering a striking contrast against the clear blue sky.\n\nOriginally built by the Dutch in the 17th century and later reconstructed under Japanese rule, the fort’s current appearance includes a restored lookout tower that visitors can ascend. The surrounding banyan trees and historic masonry evoke the site’s layered past, from colonial stronghold to modern tourist landmark.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Anping+Fort/@23.0013593,120.1607278,4a,75y,19.17h,110.15t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgIC4tM34MA!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U-nitbsbqThFutXkEVrf4xXIO0yN73by_fbFfIxy3XWQJiTZujCV6a0yYOJVsxpZqXJlU5fwOVxgJLpe9W3VhyjivH8Y5_O5E__sp9tDlkPxCUsZ1h93YIU9GLoRkx7sSS7QFM%3Dw900-h600-k-no-pi-20.150090000000006-ya309.63410924414063-ro0-fo100!7i13312!8i6656!4m9!3m8!1s0x346e767378e3e467:0x9b1e15dd6ac9adf1!8m2!3d23.0015093!4d120.1606244!10e5!14m1!1BCgIgARICCAI!16zL20vMDMyZHg5?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Geoforce群立科技 via Google Maps","capture":"2016-01 footer; uploaded2017-09","observations":["Elevated brick terrace, central stairs, mature trees","White observation tower with broad glass top and red tiled hipped roof"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/place/Anping+Old+Street/@23.0015093,120.1606244,198m/data=!3m1!1e3!4m6!3m5!1s0x346e7603ffffffff:0xe8fc95e1f2a8e820!8m2!3d23.0007174!4d120.1616449!16s%2Fg%2F1thg85qw?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Observation tower inside raised rectangular compound","Steps and mature trees around terrace, stre  auto-approved. Same apparatus reference Tamsui review-v3."}},"photo":"real-photo.jpg"},{"id":"chihkan","name":"赤崁樓","models":[{"file":"master.png","url":"../assets/spots/chihkan/collection/master.png"},{"file":"review-v1.png","url":"../assets/spots/chihkan/collection/review-v1.png"}],"model":"review-v1.png","photos":[{"file":"google-aerial-review.jpg","url":"../assets/spots/chihkan/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/chihkan/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/chihkan/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/chihkan/collection/thumbnail.png","sources":{"id":"chihkan","title":"Tainan Film Studio","page":"https://asc.tainan.gov.tw/index_en.php?id=35&modify=place","image":"https://asc.tainan.gov.tw/upload/place/702c5af152a9ac1d6bfb7388764a21d5.JPG","description":" Chihkan Tower Pavilion\n\nA two-tiered red brick pavilion rises above a neatly trimmed garden at Chihkan Tower in Tainan, Taiwan. The building’s tiled roofs curve upward at the corners, and a balcony on the upper floor offers visitors panoramic views of the grounds. In front of the pavilion, a row of stone steles rests on the backs of sculpted tortoises, while lush hedges and flowering shrubs add vibrant greenery to the scene.\n\nChihkan Tower began as the Dutch Fort Provintia in 1653 and later served under Koxinga, the Qing Dynasty, and Japanese rule. Its architecture today combines reinforced concrete with traditional wooden details, preserving the original appearance of the historic site. Designated a national first-grade historic site in 1982, it remains open daily for tourists, accessible by city bus or car.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Chihkan+Tower/@22.9973876,120.2025364,15a,75y,31.25h,94.83t/data=!3m7!1e1!3m5!1sJ21lYp64O_UgkXtLKg-jRw!2e0!6shttps:%2F%2Fstreetviewpixels-pa.clients6.google.com%2Fv1% e complex, known locally as the Kaohsiung Camel, features a row of aged grey brick buildings with pitched roofs lining a spacious brick courtyard. Each warehouse displays weathered facades, peeling paint, and exposed red brick foundations, reflecting their industrial heritage. A large metal rolling door and a pair of trash bins are positioned against the nearest building, while the overcast sky and soft daylight highlight the muted tones of the scene.\n\nTaken on October 26, 2022, in Gushan District, Kaohsiung City, this photograph captures the historic atmosphere of the Pier-2 Art Center’s Penglai warehouses. The site’s address is No. 99, Penglai Road, and the temperature was 26°C under cloudy skies.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/The+Pier2+Art+Center/@22.6195538,120.2820494,3a,75y,260h,110t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICE4LGtOQ!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U8BtQ1oxYGOPwQbRP_OSdxmFDGjxoWjfa0l1jYJjBNWJzHHlTP7GT3CGZndZpUC2k-BV_yTGv5b9SLnU8Tpp0DCOJCwc_mNno-51skWZYGi8mHA9Dq3sisuWNHy15llWfXEUjVV%3Dw900-h600-k-no-pi-20-ya145.5561294555664-ro0-fo100!7i13312!8i6656!4m9!3m8!1s0x346e047620e1c45b:0xe6d6d1bd1c764df2!8m2!3d22.6199803!4d120.2815287!10e5!14m1!1BCgIgARICCAI!16s%2Fm%2F010glgxt?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Iclick Inc 愛點科技 via Google Maps","capture":"2015-11 footer; uploaded2017-08","observations":["Low grey warehouses with gabled corrugated roofs","Tree-lined paved space and existing rail tracks nearby"],"limitations":"Historical tram configuration, no train vehicle verified","usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/place/Dayi+Pier-2/@22.6199803,120.2815287,396m/data=!3m1!1e3!4m6!3m5!1s0x346e03883c3cce59:0x2713f46653c84c50!8m2!3d22.618553!4d120.28  and historic character.\n\nThis image captures the Cihou Lighthouse, part of the Cijin Scenic Area in Kaohsiung, Taiwan. Visitors often reach the site by taking the KMRT to Sizihwan Station, walking to Gushan Ferry Pier, and crossing to Cijin Island by ferry. After exploring nearby attractions like Cihou Fort and wandering along the seafood street, travelers pause at the lighthouse to admire its maritime heritage and coastal views.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Kaohsiung+Lighthouse/@22.6155918,120.2650699,3a,75y,239.89h,90.11t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICv1Y-NtQE!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U8tkijF36oXksyYpUllhMMSPCKCkz7wgrwWaec0B1vRBhdTr5LQTQBwG9qB2JJZqcRCCBtGbPRVJBeYQ3qSBETbURiWOIFUznyH6hYay6iY8tifn5HsjaYXMO-rwiMB4i-DWVdlsA%3Dw900-h600-k-no-pi-0.11253999999999564-ya239.88747-ro0-fo100!7i5952!8i2976!4m9!3m8!1s0x346e03f0f7fef989:0x4acca539f4901d4d!8m2!3d22.6155918!4d120.2650699!10e5!14m1!1BCgIgARICCAI!16s%2Fm%2F010gn63r?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Alfred Wong via Google Maps","capture":"2024-12","observations":["White low annex linked to squat cylindrical lantern tower with dark cap","Terrace stairs and white rails, hillside planting and courtyard"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@22.6155918,120.2650699,396m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Lighthouse on wooded north cap of Qihou Hill","Open sea west and harbor entrance north/east; piers beyond compact lighthouse crop"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"}]},"blueprint":{"spotId":"cijin review.jpg","url":"../assets/spots/taroko/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/taroko/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/taroko/collection/thumbnail.png","sources":{"id":"taroko","title":"Explore Hualien’s Stunning Taroko National Park on a Day Tour","page":"https://www.willflyforfood.net/take-a-day-tour-of-gorge-ous-taroko-national-park-in-hualien-taiwan/","image":"https://www.willflyforfood.net/wp-content/uploads/2018/03/swallow-grotto9.jpg.webp","description":" Taroko Gorge’s Meandering River\n\nA vivid turquoise river carves its way through steep marble walls, revealing the raw power of the Liwu River over centuries. Pebble-strewn banks contrast with the smooth, striated rock faces, while patches of greenery cling to the cliffs above. High on the left, a narrow walkway and tunnel—part of the Swallow Grotto trail—offer visitors a close-up view of the gorge’s dramatic contours.\n\nThis section of Taroko National Park showcases the interplay of water and stone that earned it the nickname “Marble Gorge.” The vibrant blue-green water, shaped by mineral-rich marble, flows steadily through the narrow canyon. Visitors often pause on the cliffside path to photograph the swirling currents and towering rock formations, making this spot one of the park’s most photographed vistas.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Yanzikou+Trail/@24.1735718,121.5636453,3a,75y,79.89h,90.11t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICJraLBRw!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U9-rXXE5mBCFkhU8qQThaPTfypUNQlms4OOK8LOrN-9TVBrZ8z4nhQnmN4S1wRea1JP6OMDn5H4zNRD2KHJqE3djudk_sLza0jQGkyRn3dV2mtsZPOvhnjpBeFOYpqtCMRQi7Y%3Dw900-h600-k-no-pi-0.11257000000000517-ya179.88743-ro0-fo100!7i8704!8i4352!4m13!1m2!2m1!1z5aSq6a2v6ZajIOeHleWtkOWPow!3m9!1s0x34688406253f06c5:0x68def2c2805ede45!8m2!3d24.1735718!4d121.5636453!10e5!14m1!1BCgIgARICCAI!1 2.png"}],"model":"review-v2.png","photos":[{"file":"context-photo.jpg","url":"../assets/spots/qixingtan/reference/context-photo.jpg"},{"file":"google-aerial-review.jpg","url":"../assets/spots/qixingtan/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/qixingtan/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/qixingtan/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/qixingtan/collection/thumbnail.png","sources":{"id":"qixingtan","title":"I Could’ve Sat Here All Day — Qixingtan Beach Is That Peaceful | Trip.com Hualien","page":"https://www.trip.com/moments/detail/hualien-1366-135430871/","image":"https://ak-d.tripcdn.com/images/1mi5o224x94n73dh018DA.jpg?proc=source%2Ftrip","description":"Peaceful Qixingtan Beach\n\nA serene expanse of smooth pebbles lines the shore of Qixingtan Beach in Hualien, Taiwan, where gentle waves roll in under a blanket of gray clouds. The muted tones of the sea blend with the overcast sky, evoking a sense of calm and solitude. A cool breeze drifts across the scene, enhancing the refreshing coastal ambiance.\n\nThis weekday visit reveals the beach’s reputation as a hidden gem for travelers seeking tranquility. The unique pebble shoreline and soft, rhythmic surf make Qixingtan Beach a peaceful retreat away from crowded tourist spots.","supplementary":[{"title":"七星潭旅游攻略大全：门票+海拔+交通+天气+怎么玩？-Mytaiwan.org","page":"https://www.mytaiwan.org/taiwan-travel-guide/qixingtan-beach.html","image":"https://www.mytaiwan.org/skin/mytaiwan/images/pictures/qixingtan-beach5.jpg","description":" Tranquil Pebble Beach Stone Stack\n\nA carefully balanced stack of smooth, pale stones sits atop a bed of rounded pebbles, framed by the vibrant turquoise waters of Qixingtan Beach in Hualien, Taiwan. The stones, worn by the ocean’s ebb and flow, contrast with the deep blue sea and the soft white clouds scattered across the sky. This minimalist arrangement highlights the natural textures and colors of the coastal landscape.\n\nVisitors to Qixingtan Beach often stroll along the pebble shore, enjoying the rhythmic sound of waves and the gentle sea breeze. The site is renowned for its fault-formed curved bay and offers free access year-round, with peak season from April to October. Popular pastimes include watching sunrises and sunsets, stacking stones for good luck, cycling along the coastal path, and sampling local snacks from nearby vendors.","file":"context-photo.jpg"},{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Qixingtan+Beach/@24.032438,121.6286741,3a,75y,320.3h,92.14t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICk4OKoYg!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U-mibR8byLh5V60DS0KRBnrsMDdqcz_jssvQ7rs0z7KO2xE9ekqoUxFdYgRa6tPtPebioCRGtYfltUiiyHBXZRUkuWFT3vCcEMDwaL-lWHEZDvtzJj8PHghsB00VD5HHJyKIIbB%3Dw900-h600-k-no-pi-2.138840000000002-ya320.3002-ro0-fo100!7i6080!8i3040!4m9!3m8!1s0x34689d87e68820f5:0xd027880d5fd378a!8m2!3d24.0430498!4d121.6224926!10e5!14m1!1BCgIgARICCAI!16s%2Fm%2F0100fx_c?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"吳丹升 via Google Maps","capture":"2019-03","observations":["Grey rounded pebble beach, energetic white surf","Bay curves toward distant northern mountain flank"],"limitations":"Historical shore; fine bike-path arrangement not in this angle","usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@24.03,121.625,1569m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Pebble shore and ocean east, paths on landward side","Curving coast beside airport, airport excluded from model crop"],"limitations":"Northern mountain profile not verified from this central overhead cro  countryside’s serene beauty and the ease of access along Brown Avenue.","supplementary":[{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/place/Takeshi+Kaneshiro+Tree/@23.0973841,121.2044414,3a,75y,20h,90t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgIDE8M6xEw!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U8KpQEy1ZEbobtUKjF2JwvprOXlDyKNEMOq1AQPetrJz2U5FGg4gMr6zJUOZI-jXfh6N03vZoBLaF933ZkOWoRiKrM_WgcVSOfPKnoQ9O5hRG0BevG8SO0GSU6rvW6xwxi6ZuA9%3Dw900-h600-k-no-pi0-ya20-ro0-fo100!7i8192!8i4096!4m9!3m8!1s0x346f0b8246375e45:0x8d0f5fceb49ea742!8m2!3d23.0974397!4d121.2045098!10e5!14m1!1BCgIgARICCAI!16s%2Fg%2F11b6bmqwtc?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"李庫柏 via Google Maps","capture":"2019-01","observations":["Actual aerial panorama over regular field plots and narrow lanes","Mountain ridge beyond flat farmland, flooded winter paddies"],"limitations":"Season differs from green-rice reference; field conditions not mixed literally","usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Takeshi+Kaneshiro+Tree/@23.0973228,121.2049085,3a,75y,90t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgID2z9jvbQ!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U8DMTW8ixz6vLowBBiJHxXG7xbqAHegXlOmYXAPT72j-dB0f0SzA7UVlY6cKVcZUf5lWkDOsi6O8YS9Pbwxwt68yWLGZpmGVFMwTL97YWjCG1F19Q0n-QxSr7dRjIVd0t_mNUuo%3Dw900-h600-k-no-pi0-ya91-ro0-fo100!7i8704!8i4352!4m9!3m8!1s0x346f0b8246375e45:0x8d0f5fceb49ea742!8m2!3d23.0974397!4d121.2045098!10e5!14m1!1BCgIgARICCAI!16s%2Fg%2F11b6bmqwtc?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"陳阿祿 via Google Maps","capture":"2022-05","observations":["Single tree at narrow rural lane intersection, simple bench","Flat rice paddies and low concrete field/channel borders"],"usage":"Research reference o
