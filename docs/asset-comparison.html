oto.jpg","url":"../assets/spots/palace-museum/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/palace-museum/collection/thumbnail.png","sources":{"id":"palace-museum","title":"『2024-2025 年末年始台湾 ８日間⑧　～５日目午前：台北観光　故宮博物院訪問と絶品魯肉飯と豚足を食す～』台北(台湾)の旅行記・ブログ by たびっこさんciteフォートラベル","page":"https://4travel.jp/travelogue/11975300","image":"https://cdn.4travel.jp/img/thumbnails/imk/travelogue_album/11/97/53/650x_11975300.jpg?updated_at=1750839921","description":" National Palace Museum Entrance\n\nA family trip to Taipei’s National Palace Museum begins with a quiet morning arrival at the grand marble staircases leading up to the main hall. Taiwanese flags line the white balustrades, and the museum’s green-tiled roofs and pale yellow walls stand out against a backdrop of wooded hills under a cloudy sky. Only a handful of visitors are present before opening, allowing for unobstructed photos of the iconic facade.\n\nInside, the group uses their Taipei FunPASS to bypass the regular ticket line and store their luggage in self-service lockers. They explore renowned exhibits such as the Jadeite Cabbage and Mao Gong Ding, noting that some treasures like the Meat-Shaped Stone are on loan elsewhere. After a thorough tour of the first-floor galleries, they plan to continue their cultural and culinary adventure in Taipei, sampling local specialties and visiting other landmarks throughout the day.","supplementary":[{"file":"real-photo-overview.jpg","title":"NationalPalace MuseumFrontView.jpg","page":"https://commons.wikimedia.org/wiki/File:NationalPalace_MuseumFrontView.jpg","image":"https://upload.wikimedia.org/wikipedia/commons/b/b4/NationalPalace_MuseumFrontView.jpg","author":"Peellden","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0/","date":"2007-12-16","description":"Historical elevated overview used for main-hall roof massing and terraces; not evidence of current landscaping."},{"file":"google-air-overview.jpg","title":"故宮館方空中 360° 全景（Google Maps ge":"https://cdn.4travel.jp/img/thumbnails/imk/travelogue_pict/85/65/25/650x_85652590.jpg?updated_at=1744357622","description":" Taichung’s Rainbow Village\n\nA group of visitors strolls along a narrow lane in Taichung’s Rainbow Village, marveling at the riot of color that envelops every surface. The humble row of single-story houses has been transformed into a vibrant open-air gallery by an elderly local artist, whose whimsical designs feature flowers, animals, and smiling faces in bold primary hues. Under a bright midday sun, the painted walls and ground patterns create a cheerful, immersive environment that draws photographers and art lovers alike.\n\nThis stop was part of a larger seven-city Taiwan tour, which included Taipei’s iconic 101 observatory, the lantern-lit sky of Shifen, and the nostalgic alleys of Jiufen. Travelers rated the overall experience highly for sightseeing and transportation, noting the ease of bus and high-speed rail connections. The Rainbow Village stands out as a testament to individual creativity, turning a once-forgotten military settlement into one of central Taiwan’s most Instagrammed landmarks.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Rainbow+Village/@24.1336514,120.6098856,3a,75y,359.89h,90.11t/data=!3m8!1e1!3m6!1sCIABIhCYlKxEzwcreH5jWOnWlmuH!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U_eMZu5FVXUgUPSMN43nKvzxr1ukzr_hyhzncSFgty02UnAh7QHEVJvT_RfLLimQys6kICFmaNrYyjBZRrQHcMtNaSrfhfaDnccHMZPHTiu0KsIBfDYLlP68WrfkI-bXlNQwOMsWbLcLXKC%3Dw900-h600-k-no-pi-0.11253999999999564-ya359.88745-ro0-fo100!7i5888!8i2944!4m9!3m8!1s0x34693e87f82595db:0x9a8836cb8c007336!8m2!3d24.1337152!4d120.6098437!10e5!14m1!1BCgIgARICCAI!16s%2Fg%2F11cls6p_by?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Sanctum Realm via Google Maps","capture":"2025-07","observations":["Low painted courtyard/lane","Weathered white/red naive figures, lement":"Two painted houses on a painted ground patch","notes":"Patterns become colour blocks at token scale; keep the palette multicoloured."},"qa":{"geographic":"pending","identity":"pending","style":"pending","collection":"pending","notes":"Small low painted cluster retained; primary old mural image and 2025 repainting differ, exact current pattern/house count not a measured survey. New real-reference generation in review-v1.png; visual review only, not auto-approved. Same apparatus reference Tamsui review-v3."}},"photo":"real-photo.jpg"},{"id":"lukang","name":"鹿港老街","models":[{"file":"master.png","url":"../assets/spots/lukang/collection/master.png"},{"file":"review-v1.png","url":"../assets/spots/lukang/collection/review-v1.png"},{"file":"review-v2.png","url":"../assets/spots/lukang/collection/review-v2.png"},{"file":"review-v3.png","url":"../assets/spots/lukang/collection/review-v3.png"},{"file":"review-v4.png","url":"../assets/spots/lukang/collection/review-v4.png"},{"file":"review-v5.png","url":"../assets/spots/lukang/collection/review-v5.png"}],"model":"review-v5.png","photos":[{"file":"context-photo.jpg","url":"../assets/spots/lukang/reference/context-photo.jpg"},{"file":"google-aerial-review.jpg","url":"../assets/spots/lukang/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/lukang/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/lukang/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/lukang/collection/thumbnail.png","sources":{"id":"lukang","title":"摸乳巷-遊憩景點-彰化旅遊資訊網","page":"https://tourism.chcg.gov.tw/AttractionsContent.aspx?chk=410219db-b79a-4464-9e75-75d910ae8ce4&id=147&l=TW","image":"https://tourism.chcg.gov.tw/upload/27/2023101615081775428.png","description":" Mōrǔ Xiàng (Breast-Touching Lane)\n\nNestled in Lukang, Changhua County, this historic alley measures under 70 centimeters at its narrowest point, forcing passersby to brush shoulders as they traverse the red-brick corridor. A faded red doorframe at the entrance displays vertical couplets reading “摸乳巷裡無乳摸,” hinting at the alley’s cheeky moniker. Overhead, verdant foliage softens the brick walls, while a lone visitor stands at the far end, illustrating the alley’s intimate scale.\n\nOriginally designed as a firebreak between long row houses and to shield interiors from strong sea winds, the passage earned various names—“Chest-Guarding Lane” and “Gentlemen’s Lane”—before the blunt “Breast-Touching Lane” became most renowned. A folk tale suggests the name also echoes “Dream Lane,” reflecting ancient hopes for childbirth, which over time merged phonetically into the current title.","supplementary":[{"title":"跟著課本走鹿港│鹿港老街、古蹟、老屋維修與傳統工藝，符合國小社會課本的我的家鄉主題導覽","page":"https://changhua-travel.com/event/detail/31","image":"https://cdn.thothcdn.com/cache/changhua-travel/images/upload_file/dsc_5614_compressed-xeletv.jpg","description":" Lukang Old Street Alley\n\nA quiet, narrow alley in Lukang Old Street showcases red-brick facades and a row of parked scooters along a tiled pathway. Overhead electrical wires crisscross above, while a small wooden lantern affixed to the wall evokes the district’s historic charm. Potted greenery and glimpses of traditional doorways further enrich the scene.\n\nThis setting is part of a guided tour in Changhua County that highlights the preservation of century-old buildings, local crafts, and cultural heritage. Visitors explore sites like Tianhou Temple, half-wells, and restored residences, learning how sustainable practices and adaptive reuse keep Lukang’s stories alive.","file":"context-photo.jpg"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@24.056301,120.4325817,196m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Putou Street curves through narrow deep lots","Yaolin Street continu google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/anping/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/anping/collection/thumbnail.png","sources":{"id":"anping","title":"台南安平｜台南一日遊懶人包！拜訪文青咖啡廳、大啖美食小吃～漫遊古都，欣賞浪漫夕陽-輕旅行","page":"https://travel.yam.com/article/124879","image":"https://pimg.1px.tw/gtchao/1626675677-323526121-g.jpg","description":" Anping Fort Watchtower\n\nA sturdy red-brick wall with patterned crenellations forms the base of Anping Fort, its weathered surface bearing the marks of centuries. Above the wall, a white-painted watchtower capped with a red-tiled roof peeks out from behind a canopy of lush green trees, offering a striking contrast against the clear blue sky.\n\nOriginally built by the Dutch in the 17th century and later reconstructed under Japanese rule, the fort’s current appearance includes a restored lookout tower that visitors can ascend. The surrounding banyan trees and historic masonry evoke the site’s layered past, from colonial stronghold to modern tourist landmark.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Anping+Fort/@23.0013593,120.1607278,4a,75y,19.17h,110.15t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgIC4tM34MA!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U-nitbsbqThFutXkEVrf4xXIO0yN73by_fbFfIxy3XWQJiTZujCV6a0yYOJVsxpZqXJlU5fwOVxgJLpe9W3VhyjivH8Y5_O5E__sp9tDlkPxCUsZ1h93YIU9GLoRkx7sSS7QFM%3Dw900-h600-k-no-pi-20.150090000000006-ya309.63410924414063-ro0-fo100!7i13312!8i6656!4m9!3m8!1s0x346e767378e3e467:0x9b1e15dd6ac9adf1!8m2!3d23.0015093!4d120.1606244!10e5!14m1!1BCgIgARICCAI!16zL20vMDMyZHg5?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Geoforce群立科技 via Google Maps","capture":"2016-01 footer; uploaded2017-09","observations":["Elevated brick terrace, central stairs, mature trees","White observation tower with broad glass top and red tiled hipped roof"],"usage":"Research reference e Qing Dynasty, and Japanese rule. Its architecture today combines reinforced concrete with traditional wooden details, preserving the original appearance of the historic site. Designated a national first-grade historic site in 1982, it remains open daily for tourists, accessible by city bus or car.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Chihkan+Tower/@22.9973876,120.2025364,15a,75y,31.25h,94.83t/data=!3m7!1e1!3m5!1sJ21lYp64O_UgkXtLKg-jRw!2e0!6shttps:%2F%2Fstreetviewpixels-pa.clients6.google.com%2Fv1%2Fthumbnail%3Fcb_client%3Dmaps_sv.tactile%26w%3D900%26h%3D600%26pitch%3D-4.8283540000000045%26panoid%3DJ21lYp64O_UgkXtLKg-jRw%26yaw%3D31.252092!7i13312!8i6656!4m9!3m8!1s0x346e7661777b896d:0xf2656ec0c86f579c!8m2!3d22.997478!4d120.2025433!10e5!14m1!1BCgIgARICCAI!16zL20vMDc5c3Fj?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Street View","capture":"2017-05","observations":["Stone turtle-based steles in row before raised brick pavilion","Two-storey traditional red-tile eaves, stone columns and pierced brick parapet"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@22.997478,120.2025433,99m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Two pavilions aligned along long axis of platform, not a symmetric gate complex","Garden/open space adjacent, trees at compound edge"],"usage":"Research reference only; Google attribution/UI retained, never final image texture"}]},"blueprint":{"spotId":"chihkan","status":"references-collected","spotType":"urban","productionTier":"standard","hero":{"name":"Chihkan Tower pavilions","silhouette":"Two adjoining Chinese pavilion halls with sweeping swallowtail eaves on a ijin/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/cijin/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/cijin/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/cijin/collection/thumbnail.png","sources":{"id":"cijin","title":"『高雄 旗津風景区散策(旗後砲台・旗後灯台・鴨角活海産店) 2010/4/29』高雄(台湾)の旅行記・ブログ by 台湾見聞録さんciteフォートラベル","page":"https://4travel.jp/travelogue/11098089","image":"https://cdn.4travel.jp/img/thumbnails/imk/travelogue_album/11/09/80/650x_11098089.jpg?updated_at=1550321077","description":" Cihou Lighthouse at Cijin Scenic Area\n\nA pristine white lighthouse building crowns a series of broad stone steps, flanked by neatly trimmed bushes and a lone flagpole bearing Taiwan’s flag. The cylindrical lantern room, topped with a black dome and encircled by a metal balcony, overlooks the coastal landscape beyond. Overcast skies cast a soft, diffused light across the scene, emphasizing the lighthouse’s clean lines and historic character.\n\nThis image captures the Cihou Lighthouse, part of the Cijin Scenic Area in Kaohsiung, Taiwan. Visitors often reach the site by taking the KMRT to Sizihwan Station, walking to Gushan Ferry Pier, and crossing to Cijin Island by ferry. After exploring nearby attractions like Cihou Fort and wandering along the seafood street, travelers pause at the lighthouse to admire its maritime heritage and coastal views.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Kaohsiung+Lighthouse/@22.6155918,120.2650699,3a,75y,239.89h,90.11t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICv1Y-NtQE!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U8tkijF36oXksyYpUllhMMSPCKCkz7wgrwWaec0B1vRBhdTr5LQTQBwG9qB2JJZqcRCCBtGbPRVJBeYQ3qSBETbURiWOIFUznyH6hYay6iY8tifn5HsjaYXMO-rwiMB4i-DWVdlsA%3Dw900-h600-k-no-pi-0.11253999999999564-ya239.88747-ro0-fo100!7i5952!8i2976!4m9!3m8!1s0x346e03f0f7fef989:0x4acca539f4901d4d!8m2!3 llow-grotto9.jpg.webp","description":" Taroko Gorge’s Meandering River\n\nA vivid turquoise river carves its way through steep marble walls, revealing the raw power of the Liwu River over centuries. Pebble-strewn banks contrast with the smooth, striated rock faces, while patches of greenery cling to the cliffs above. High on the left, a narrow walkway and tunnel—part of the Swallow Grotto trail—offer visitors a close-up view of the gorge’s dramatic contours.\n\nThis section of Taroko National Park showcases the interplay of water and stone that earned it the nickname “Marble Gorge.” The vibrant blue-green water, shaped by mineral-rich marble, flows steadily through the narrow canyon. Visitors often pause on the cliffside path to photograph the swirling currents and towering rock formations, making this spot one of the park’s most photographed vistas.","supplementary":[{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Yanzikou+Trail/@24.1735718,121.5636453,3a,75y,79.89h,90.11t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICJraLBRw!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U9-rXXE5mBCFkhU8qQThaPTfypUNQlms4OOK8LOrN-9TVBrZ8z4nhQnmN4S1wRea1JP6OMDn5H4zNRD2KHJqE3djudk_sLza0jQGkyRn3dV2mtsZPOvhnjpBeFOYpqtCMRQi7Y%3Dw900-h600-k-no-pi-0.11257000000000517-ya179.88743-ro0-fo100!7i8704!8i4352!4m13!1m2!2m1!1z5aSq6a2v6ZajIOeHleWtkOWPow!3m9!1s0x34688406253f06c5:0x68def2c2805ede45!8m2!3d24.1735718!4d121.5636453!10e5!14m1!1BCgIgARICCAI!15sChPlpKrpra_plqMg54eV5a2Q5Y-jkgENbmF0aW9uYWxfcGFya-ABAA!16s%2Fg%2F1tj_2_5c?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"黃薇臻 via Google Maps","capture":"2023-07","observations":["Narrow paved cliff-side road with rail over gorge","Exposed grey marble walls and vegetation in cracks"],"limitations":"Historical 2023 image; current wall/road condition not verified","usage":"Research reference only; Google attribution/UI retained, never final image texture"}, review-v3.png","photos":[{"file":"context-photo.jpg","url":"../assets/spots/qixingtan/reference/context-photo.jpg"},{"file":"google-aerial-review.jpg","url":"../assets/spots/qixingtan/reference/google-aerial-review.jpg"},{"file":"google-ground-review.jpg","url":"../assets/spots/qixingtan/reference/google-ground-review.jpg"},{"file":"real-photo.jpg","url":"../assets/spots/qixingtan/reference/real-photo.jpg"}],"thumbnail":"../assets/spots/qixingtan/collection/thumbnail.png","sources":{"id":"qixingtan","title":"I Could’ve Sat Here All Day — Qixingtan Beach Is That Peaceful | Trip.com Hualien","page":"https://www.trip.com/moments/detail/hualien-1366-135430871/","image":"https://ak-d.tripcdn.com/images/1mi5o224x94n73dh018DA.jpg?proc=source%2Ftrip","description":"Peaceful Qixingtan Beach\n\nA serene expanse of smooth pebbles lines the shore of Qixingtan Beach in Hualien, Taiwan, where gentle waves roll in under a blanket of gray clouds. The muted tones of the sea blend with the overcast sky, evoking a sense of calm and solitude. A cool breeze drifts across the scene, enhancing the refreshing coastal ambiance.\n\nThis weekday visit reveals the beach’s reputation as a hidden gem for travelers seeking tranquility. The unique pebble shoreline and soft, rhythmic surf make Qixingtan Beach a peaceful retreat away from crowded tourist spots.","supplementary":[{"title":"七星潭旅游攻略大全：门票+海拔+交通+天气+怎么玩？-Mytaiwan.org","page":"https://www.mytaiwan.org/taiwan-travel-guide/qixingtan-beach.html","image":"https://www.mytaiwan.org/skin/mytaiwan/images/pictures/qixingtan-beach5.jpg","description":" Tranquil Pebble Beach Stone Stack\n\nA carefully balanced stack of smooth, pale stones sits atop a bed of rounded pebbles, framed by the vibrant turquoise waters of Qixingtan Beach in Hualien, Taiwan. The stones, worn by the ocean’s ebb and flow, contrast with the deep blue sea and the soft white clouds scattered across the sky. This minimalist arrangement highlights the natural textures and colors of the coastal landscape.\n\nVisitors to Qixingtan Beach often stroll along the pebble shore, enjoying the rhythmic sound of waves and the gentle sea breeze. The site is renowned for its fault-formed curved bay and offers free access year-round, with peak season from April to October. Popular pastimes include watching sunrises and sunsets, stacking stones for good luck, cycling along the coastal path, and sampling local snacks from nearby vendors.","file":"context-photo.jpg"},{"local":"google-ground-review.jpg","kind":"ground","page":"https://www.google.com/maps/place/Qixingtan+Beach/@24.032438,121.6286741,3a,75y,320.3h,92.14t/data=!3m8!1e1!3m6!1sCIHM0ogKEICAgICk4OKoYg!2e10!3e11!6shttps:%2F%2Flh3.googleusercontent.com%2Fgpms-cs-s%2FAM4Q-U-mibR8byLh5V60DS0KRBnrsMDdqcz_jssvQ7rs0z7KO2xE9ekqoUxFdYgRa6tPtPebioCRGtYfltUiiyHBXZRUkuWFT3vCcEMDwaL-lWHEZDvtzJj8PHghsB00VD5HHJyKIIbB%3Dw900-h600-k-no-pi-2.138840000000002-ya320.3002-ro0-fo100!7i6080!8i3040!4m9!3m8!1s0x34689d87e68820f5:0xd027880d5fd378a!8m2!3d24.0430498!4d121.6224926!10e5!14m1!1BCgIgARICCAI!16s%2Fm%2F0100fx_c?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"吳丹升 via Google Maps","capture":"2019-03","observations":["Grey rounded pebble beach, energetic white surf","Bay curves toward distant northern mountain flank"],"limitations":"Historical shore; fine bike-path arrangement not in this angle","usage":"Research reference only; Google attribution/UI retained, never final image texture"},{"local":"google-aerial-review.jpg","kind":"aerial","page":"https://www.google.com/maps/@24.03,121.625,1569m/data=!3m1!1e3?entry=ttu&g_ep=EgoyMDI2MTAxMS4wIKXMDSoASAFQAw%3D%3D","accessed":"2026-10-14","credit":"Google Maps / Airbus/CNES/Maxar","capture":"Not exposed","observations":["Pebble shore and ocean east, paths on landward side","Curving coast beside airport, airport excluded from model crop"],"limitations":"Northern mountain profile not verified from this central overhead crop","usage":"Resear
