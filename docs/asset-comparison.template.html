<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Islandia｜全景點模型與實景比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#344133;font:15px system-ui}header{padding:20px 25px;border-bottom:1px solid #ddd;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}button,input,select,textarea{font:inherit}button,select,input{padding:9px;border:1px solid #bec8b7;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:260px 1fr}aside{height:calc(100vh - 100px);position:sticky;top:0;padding:14px;overflow:auto;border-right:1px solid #ddd}aside input,aside select{width:100%;margin-bottom:10px}.spot{width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin:5px 0;padding:10px}.spot.selected{background:#e0e9d8;border-color:#7b9570}.spot img{width:40px;height:40px;object-fit:contain}.spot small{display:block;font-size:10px;color:#77816c}.reviewed{color:#57835c}main{padding:24px;min-width:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{margin:0 auto 0 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#fff;border-radius:12px;overflow:hidden}.imagebox{height:clamp(330px,48vw,630px);display:flex;align-items:center;justify-content:center;background:#eeeae0}.imagebox img{width:100%;height:100%;object-fit:contain}figcaption{padding:12px}figcaption select{width:100%;margin-top:8px}.empty{padding:30px;text-align:center;color:#8c8d7b}.links{padding:12px;line-height:1.8}a{color:#527754}.notes{margin-top:20px;background:#fff;padding:18px;border-radius:12px}.notes h3{margin:0 0 12px}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:12px;resize:vertical}.muted{color:#7d8373;font-size:12px;line-height:1.7}details{margin-top:16px}summary{cursor:pointer}.warning{background:#f2e6c7;padding:12px;border-radius:8px;line-height:1.7}footer{padding:12px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{font-size:13px}#count{font-size:12px;color:#737e69}@media(max-width:850px){.layout{display:block}aside{height:190px;position:static;border-right:0;border-bottom:1px solid #ddd}.pair{grid-template-columns:1fr}main{padding:14px}.imagebox{height:440px}header{padding:15px}}
</style><header><h1>Islandia｜模型 × 真實照片</h1><span id="count"></span><button id="export">匯出調整清單</button></header><div class="layout"><aside><input id="search" aria-label="搜尋景點" placeholder="搜尋名稱或 id"><select id="filter" aria-label="篩選景點"><option value="paired">有模型與照片</option><option value="models">已有模型</option><option value="all">所有景點</option><option value="todo">需要調整</option><option value="missing">缺少素材</option></select><div id="list"></div></aside><main><div class="toolbar"><h2 id="title"></h2><span id="position"></span><button id="prev">上一個</button><button id="next">下一個</button></div><div class="pair"><figure><div id="model-image" class="imagebox"></div><figcaption>目前模型<select id="model-version" aria-label="模型版本"></select></figcaption></figure><figure><div id="photo-image" class="imagebox"></div><figcaption>真實照片<select id="photo-version" aria-label="照片角度"></select></figcaption><div id="sources" class="links"></div></figure></div><div class="notes"><h3>這個景點的調整紀錄</h3><div class="checks"><label><input type="radio" name="review" value="pending"> 尚未檢查</label><label><input type="radio" name="review" value="adjust"> 需要調整</label><label><input type="radio" name="review" value="approved"> 可以保留</label></div><textarea id="note" aria-label="調整內容" placeholder="例如：主建築太矮、岩石輪廓不對、樹木位置需修正…"></textarea><p class="muted" id="save-status">紀錄存在此瀏覽器；匯出後可交給我逐一調整。紀錄不會自動修改專案 QA 或圖片。</p></div><details><summary>景點藍圖：主體、禁止新增與既有 QA</summary><div id="blueprint"></div></details><p class="muted">照片保持原貌，並排顯示不代表模型已通過地理驗收。預設顯示各景點選定的最新預覽，可切換舊版 master；缺素材的景點不會以生成圖代替實景。</p></main></div>
<script>const spots=__SPOT_DATA__;const $=s=>document.querySelector(s);let reviews={};try{reviews=JSON.parse(localStorage.getItem('islandia-art-review-v1')||'{}')}catch{}let active=location.hash.slice(1)||spots.find(s=>s.models.length&&s.photos.length)?.id;let visible=[];const versions=new Map(),photos=new Map();
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function selected(){return spots.find(s=>s.id===active)}
function rebuild(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;visible=spots.filter(s=>(s.name+' '+s.id).toLowerCase().includes(q)&&({all:true,paired:s.models.length&&s.photos.length,models:s.models.length,todo:reviews[s.id]?.status==='adjust',missing:!s.models.length||!s.photos.length}[f]));$('#list').replaceChildren();for(const s of visible){const b=el('button');b.className='spot'+(s.id===active?' selected':'');if(s.thumbnail){const im=el('img');im.src=s.thumbnail;im.loading='lazy';im.alt='';b.append(im)}const t=el('span',s.name);t.append(el('small',s.id+' · '+(s.models.length?'有模型':'缺模型')+' / '+(s.photos.length?'有照片':'缺照片')+(reviews[s.id]?.status==='adjust'?' · 待調整':reviews[s.id]?.status==='approved'?' · 已確認':'')));b.append(t);b.onclick=()=>{active=s.id;history.replaceState(null,'','#'+s.id);rebuild();show()};$('#list').append(b)}$('#count').textContent=spots.length+' 個景點 · '+spots.filter(s=>s.models.length).length+' 個有模型 · '+spots.filter(s=>s.models.length&&s.photos.length).length+' 個可對照';updateNav()}
function updateNav(){const i=visible.findIndex(s=>s.id===active);$('#position').textContent=i>=0?(i+1)+' / '+visible.length:'不在目前篩選中';$('#prev').disabled=i<=0;$('#next').disabled=i<0||i>=visible.length-1}
function fillSelect(node,items,value){node.replaceChildren();for(const it of items){const o=el('option',it.file);o.value=it.file;node.append(o)}node.value=items.some(i=>i.file===value)?value:items[0]?.file||'';node.disabled=!items.length}
function picture(node,items,file,message){node.replaceChildren();const item=items.find(i=>i.file===file)||items[0];if(!item){node.append(el('div',message));node.firstChild.className='empty';return}const a=el('a');a.href=item.url;a.target='_blank';a.style='width:100%;height:100%';const im=el('img');im.src=item.url;im.alt=selected().name+' '+item.file;a.append(im);node.append(a)}
function show(){const s=selected();if(!s)return;$('#title').textContent=s.name+' · '+s.id;fillSelect($('#model-version'),s.models,versions.get(s.id)||s.model);fillSelect($('#photo-version'),s.photos,photos.get(s.id)||s.photo||(s.photos.some(p=>p.file==='real-photo.jpg')?'real-photo.jpg':s.photos.find(p=>!p.file.startsWith('google-'))?.file));picture($('#model-image'),s.models,$('#model-version').value,'尚未製作收藏模型');picture($('#photo-image'),s.photos,$('#photo-version').value,'尚未收集真實照片');$('#sources').replaceChildren();if(s.sources){for(const source of [s.sources,...(s.sources.sources||[]),...(s.sources.supplementary||[])]){if(!source.page)continue;const p=el('div'),a=el('a',source.title||source.local||source.file||'來源');a.href=source.page;a.target='_blank';a.rel='noreferrer';p.append(a);if(source.author||source.license)p.append(el('span',' · '+[source.author,source.license].filter(Boolean).join(' / ')));$('#sources').append(p)}}const review=reviews[s.id]||{status:'pending',note:''};for(const n of document.querySelectorAll('[name="review"]'))n.checked=n.value===review.status;$('#note').value=review.note;$('#blueprint').replaceChildren();if(s.blueprint){const b=s.blueprint;for(const [label,val] of [['主體',b.hero?.name],['取景',b.crop],['禁止新增',(b.doNotInvent||[]).join('、')],['既有 QA',JSON.stringify(b.qa||{})]])$('#blueprint').append(el('p',label+'：'+(val||'尚未填寫')))}else $('#blueprint').textContent='尚無藍圖';updateNav()}
function save(){const s=selected();reviews[s.id]={id:s.id,name:s.name,status:document.querySelector('[name="review"]:checked')?.value||'pending',note:$('#note').value,model:$('#model-version').value,photo:$('#photo-version').value,updatedAt:new Date().toISOString()};try{localStorage.setItem('islandia-art-review-v1',JSON.stringify(reviews));$('#save-status').textContent='已儲存於此瀏覽器；請匯出調整清單以保留紀錄。'}catch{$('#save-status').textContent='瀏覽器儲存失敗，請立即匯出調整清單。'}rebuild()}
$('#search').oninput=rebuild;$('#filter').onchange=()=>{rebuild();if(!visible.some(s=>s.id===active)&&visible.length){active=visible[0].id;rebuild();show()}};$('#prev').onclick=()=>navigate(-1);$('#next').onclick=()=>navigate(1);function navigate(d){const i=visible.findIndex(s=>s.id===active);active=visible[i+d].id;history.replaceState(null,'','#'+active);rebuild();show()}
$('#model-version').onchange=()=>{const s=selected();versions.set(s.id,$('#model-version').value);picture($('#model-image'),s.models,$('#model-version').value,'缺模型')};$('#photo-version').onchange=()=>{const s=selected();photos.set(s.id,$('#photo-version').value);picture($('#photo-image'),s.photos,$('#photo-version').value,'缺照片')};$('#note').oninput=save;for(const n of document.querySelectorAll('[name="review"]'))n.onchange=save;
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),reviews:Object.values(reviews)},null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='islandia-art-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};rebuild();show();</script></html>
