<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islandia｜圖片瘦身畫質比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#344133;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 8px}.summary{font-size:18px;margin:10px 0}.muted{font-size:13px;line-height:1.6;color:#65705e}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:18px 0}select{font:inherit;padding:10px;border:1px solid #bbc5b6;border-radius:8px;max-width:100%}input{width:20px;height:20px;vertical-align:middle}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;border-radius:12px;background:white;overflow:hidden}.picture{position:relative;aspect-ratio:1;overflow:hidden;background-color:#eeeae0;background-image:linear-gradient(45deg,#e3dfd5 25%,transparent 25%),linear-gradient(-45deg,#e3dfd5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3dfd5 75%),linear-gradient(-45deg,transparent 75%,#e3dfd5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}img{width:100%;height:100%;object-fit:contain}.zoom img{width:1024px;height:1024px;max-width:none;object-fit:fill;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}figcaption{padding:12px;font-size:14px;line-height:1.5}strong{display:block}a{color:#527754}label{cursor:pointer}
@media(max-width:500px){main{padding:12px}.pair{gap:8px}figcaption{padding:8px;font-size:12px}h1{font-size:20px}}
</style>
<main><h1>Islandia｜圖片瘦身畫質比較</h1><p class="summary" id="total"></p><p class="muted">目前正式資產共 74 張，全部內建、可離線使用。原始 PNG 與待審模型保留；此數字只計圖片檔案，不代表整個 App 安裝容量。</p>
<div class="controls"><select id="sample" aria-label="選擇畫質比較範例"></select><label><input type="checkbox" id="zoom">放大細節（相同取景）</label></div>
<div class="pair"><figure><div class="picture"><img id="original" alt="原始 PNG"></div><figcaption><strong>原始 PNG</strong><span id="before"></span></figcaption></figure><figure><div class="picture"><img id="optimized" alt="App 使用的 WebP"></div><figcaption><strong>App 使用的 WebP</strong><span id="after"></span></figcaption></figure></div>
<p class="muted" id="quality"></p><p class="muted">收藏大圖：1024px／品質 90；列表縮圖：512px／品質 88，保留 3 倍螢幕與小工具細節；透明圖標：512px 無損 WebP，逐像素及透明度校驗。沒有新增調色。</p><a href="runtime-asset-report.json">完整容量與檔案校驗報告</a></main>
<script>
const data={"samples":[{"family":"collection","source":"assets/spots/taipei-101/collection/day.png","output":"assets/spots/taipei-101/collection/day.webp","sourceSha256":"3b5729c03ce4ef24dc26700b4d0483f2beb6ad1f0ff3da2412e2f4e7c44eef2b","outputSha256":"78c51fc665e6c7ec1163c9ad9f50cc097520a237fc1453bace98ff06175a0fe4","sourceBytes":1404724,"outputBytes":116856,"dimensions":[1024,1024],"lossless":false,"quality":90,"label":"台北 101：窗格與建築"},{"family":"collection","source":"assets/spots/alishan/collection/day.png","output":"assets/spots/alishan/collection/day.webp","sourceSha256":"52aac83ec16e90d140c1c4fed8d6a45b9fea634689925d0c321b3e25b2cf2c5e","outputSha256":"672e64acee8d0673a3fd1d8081473cbd860bfdd2c26f34f45debb02e730ef40d","sourceBytes":1767919,"outputBytes":222806,"dimensions":[1024,1024],"lossless":false,"quality":90,"label":"阿里山：樹葉與木紋"},{"family":"collection","source":"assets/spots/qingshui-cliff/collection/day.png","output":"assets/spots/qingshui-cliff/collection/day.webp","sourceSha256":"17d3c94cc5fc1b744d0cdec7acbd391b50a4238c5d46fdf714fac5f95799c7c4","outputSha256":"6bcf7a2a39198bfcb1c98c2aac42b2ce9f2f633d1d76d6e8f897d0bcaf4dd012","sourceBytes":1709535,"outputBytes":213730,"dimensions":[1024,1024],"lossless":false,"quality":90,"label":"清水斷崖：岩石與海面"},{"family":"world","source":"assets/spots/yehliu/world/landmark.png","output":"assets/spots/yehliu/world/landmark.webp","sourceSha256":"667b8fb30861ca9eefaa94e09f5bcc6b5926f2c79400acaa28c275b5a4f4c31a","outputSha256":"b3af2cc45cb7291beb481d7b8285afe5bb578f5d1a59dce02fb3f8b22da8c28a","sourceBytes":200996,"outputBytes":125248,"dimensions":[512,512],"lossless":true,"quality":null,"label":"野柳圖標：透明邊緣（無損）"}],"before":58335191,"after":11055680,"reduction":81.05};const $=s=>document.querySelector(s);const kb=n=>(n/1024).toFixed(1)+' KiB';
$('#total').textContent=(data.before/1e6).toFixed(2)+' MB → '+(data.after/1e6).toFixed(2)+' MB（減少 '+data.reduction+'%）';
data.samples.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.label;$('#sample').append(o)});
let version=0;
async function show(){const n=++version,s=data.samples[Number($('#sample').value)];document.querySelector('.pair').style.visibility='hidden';$('#original').src='../'+s.source;$('#optimized').src='../'+s.output;try{await Promise.all([$('#original').decode(),$('#optimized').decode()]);if(n!==version)return;$('#before').textContent=kb(s.sourceBytes);$('#after').textContent=kb(s.outputBytes)+' · '+s.dimensions.join(' × ')+'px';$('#quality').textContent=s.lossless?'此圖標採無損壓縮，RGBA 像素校驗完全一致。':'收藏圖為高品質有損壓縮，可勾選放大細節，檢查窗格、葉片與石材。';document.querySelector('.pair').style.visibility='visible'}catch{if(n===version)$('#quality').textContent='圖片載入失敗，請重新選擇或重新整理。'}}
$('#sample').onchange=show;$('#zoom').onchange=()=>document.querySelector('.pair').classList.toggle('zoom',$('#zoom').checked);show();
</script></html>
