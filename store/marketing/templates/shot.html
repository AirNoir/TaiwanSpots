<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--accent:#B8711A;--text:#1E2531;--sub:#5F6877}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);font-family:'Noto Sans TC',sans-serif}
body{position:relative;background:radial-gradient(120% 70% at 50% 0%,#FFFBF4 0%,#F6F1E7 55%,#EFE6D6 100%)}
.cap{position:absolute;left:0;right:0;top:calc(var(--H)*.045);text-align:center;padding:0 8%}
.dot{display:inline-block;width:calc(var(--W)*.012);height:calc(var(--W)*.012);border-radius:50%;background:var(--accent);margin-bottom:calc(var(--H)*.012)}
h1{color:var(--text);font-weight:900;font-size:var(--h1);line-height:1.25;letter-spacing:.04em}
p{color:var(--sub);font-weight:500;font-size:var(--p);margin-top:calc(var(--H)*.01);letter-spacing:.06em}
.dev{position:absolute;left:50%;bottom:calc(var(--H)*-0.0);transform:translateX(-50%);background:#1A1A1C;padding:var(--bz);border-radius:var(--r);box-shadow:0 40px 90px rgba(80,55,20,.22),0 8px 24px rgba(80,55,20,.12)}
.dev img{display:block;width:var(--sw);border-radius:calc(var(--r) - var(--bz))}
</style></head><body>
<div class="cap"><h1 id="h"></h1><p id="s"></p></div>
<div class="dev" id="d"><img id="i"></div>
<script>
const q=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const R=document.documentElement.style;
R.setProperty('--W',q.W+'px');R.setProperty('--H',q.H+'px');
R.setProperty('--h1',q.h1+'px');R.setProperty('--p',q.p+'px');
R.setProperty('--sw',q.sw+'px');R.setProperty('--bz',q.bz+'px');R.setProperty('--r',q.r+'px');
document.getElementById('h').textContent=q.title;document.getElementById('s').textContent=q.sub;
const d=document.getElementById('d');d.style.bottom=q.bottom+'px';
document.getElementById('i').src=q.img;
</script></body></html>
